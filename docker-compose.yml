services:
  backend:
    build:
      context: ./back
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=emails_db
      - MONGO_URI=mongodb://mongodb:27017/emails_db
      - SECRET_KEY=secret_key
      - FRONT_URL=http://localhost
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - app-network

  nginx:
    build:
      context: ./ 
      dockerfile: ./nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
